*{box-sizing:border-box}body{margin:0;background:#edf7ef;color:#23463e;font:700 1rem ui-rounded,"Hiragino Maru Gothic ProN",system-ui,sans-serif}main{max-width:780px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;font-size:clamp(24px,5vw,38px)}button,a{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #285c93;outline-offset:3px}#lang,#again,#mode{background:#fff;border:2px solid #78a492;border-radius:16px;min-height:48px;padding:8px 14px}
#hint{text-align:center;margin:12px 0;min-height:1.5em}.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:620px;margin:auto}.card{min-width:0;min-height:75px;aspect-ratio:1.7;background:#fffdf5;border:3px solid #8ab6a3;border-radius:22px;box-shadow:0 4px #c6dfcb;display:grid;place-items:center;padding:8px}.card img{width:95%;height:100%;max-height:125px;object-fit:contain}.card[aria-pressed=true]{background:#fff3bd;border-color:#af7623}.card.matched{background:#d6f1d4;border-color:#4c8b62}.card.back{background:repeating-linear-gradient(135deg,#dbe9ff 0 14px,#cdddf5 14px 28px);color:#395e8d;font-size:clamp(30px,7vw,54px)}
.track{position:relative;overflow:hidden;min-height:68px;height:clamp(68px,15vw,125px);margin:14px 0 8px;border-radius:16px;background:linear-gradient(#d9efff 0 70%,#c5e5ae 70%)}.track::after{content:"";position:absolute;left:0;right:0;bottom:12%;height:10px;background:linear-gradient(#536c5f 0 2px,transparent 2px 8px,#536c5f 8px),repeating-linear-gradient(90deg,#9b775d 0 8px,transparent 8px 24px)}
.convoy{position:absolute;bottom:12%;height:78%;width:clamp(125px,43vw,300px);display:flex;z-index:1;animation:roll 1.1s ease-in-out both}.convoy img{width:50%;object-fit:contain;object-position:center bottom}.convoy img+img{margin-left:-4px}@keyframes roll{from{left:-46%}to{left:53%}}
#actions{display:flex;justify-content:center;gap:8px;margin:10px 0}#actions[hidden]{display:none}footer{text-align:center;margin-top:18px}@media(prefers-reduced-motion:reduce){.convoy{animation:none;left:30%}}

/* Keep play and primary touch controls side by side on landscape tablets. */
@media (orientation: landscape) and (min-width: 740px) and (min-height: 360px) {
main { max-width: 1280px; padding: 14px 18px 22px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(195px, 30%); gap: 10px 16px; align-items: start; }
main > :is(header, #hint, nav, footer) { grid-column: 1 / -1; }
#hint { margin: 0; }
#board { grid-column: 1; grid-row: 3 / 5; width: 100%; max-width: 780px; }
.card { aspect-ratio: auto; height: clamp(100px, 32dvh, 235px); }
.card img { max-height: 100%; }
#track { grid-column: 2; grid-row: 3; margin: 0; height: clamp(78px, 23dvh, 165px); }
.convoy { width: min(61%, 300px); }
#actions { grid-column: 2; grid-row: 4; align-self: start; flex-wrap: wrap; margin: 0; }
#actions button { flex: 1 1 135px; }
main > nav.hiiro-links { width: 100%; }
}

const $ = selector => document.querySelector(selector);
const board = $('#board');
let lang = 'ja';
try { if (localStorage.getItem('norimono-lang') === 'en') lang = 'en'; } catch {}
const words = (ja,en) => lang === 'ja' ? ja : en;
let memory = true, cards, selected, locked, timer, audio;
let previousPair;
function picture(train) {
  const img = new Image();
  img.src = train.src;
  img.alt = '';
  img.draggable = false;
  return img;
}
function playNotes(notes, spacing = .07, duration = .20, wave = 'sine') {
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume().catch(() => {});
    notes.forEach((pitch,index) => {
      const start = audio.currentTime + index*spacing;
      const tone = audio.createOscillator();
      const gain = audio.createGain();
      tone.frequency.value = pitch;
      tone.type = wave;
      gain.gain.setValueAtTime(.001,start);
      gain.gain.exponentialRampToValueAtTime(.08,start+.02);
      gain.gain.exponentialRampToValueAtTime(.001,start+duration);
      tone.connect(gain).connect(audio.destination);
      tone.start(start);
      tone.stop(start+duration+.01);
    });
  } catch {}
}
function start() {
  clearTimeout(timer);
  const pairs = trains.flatMap((train,index) => trains.slice(index+1).map(other => [train,other]));
  const choices = pairs.filter(([first,second]) => first !== previousPair?.[0] || second !== previousPair?.[1]);
  previousPair = choices[Math.floor(Math.random()*choices.length)];
  const pool = [...previousPair,...previousPair];
  cards = Array.from({length:4},() => ({train:pool.splice(Math.floor(Math.random()*pool.length),1)[0],matched:false}));
  selected = [];
  locked = false;
  $('#track').replaceChildren();
  board.replaceChildren(...cards.map((card,index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'card';
    button.addEventListener('click',() => pick(index));
    return button;
  }));
  render();
}
function render() {
  const completed = cards.every(card => card.matched);
  document.documentElement.lang = lang;
  $('#title').textContent = words('でんしゃペア','Train Pairs');
  document.title = $('#title').textContent + words(' | Hiiroゲーム',' | Hiiro Games');
  $('#lang').textContent = words('English','日本語');
  $('nav').setAttribute('aria-label', words('ほかのでんしゃゲーム','More train games'));
  document.querySelectorAll('[data-en]').forEach(node => { node.textContent = node.dataset[lang]; });
  $('#hint').textContent = completed ? words('✨ ぜんぶ つながった！','✨ All paired!') : locked ? words('もういちど','Try again') : memory ? words('めくって さがそう','Flip two cards') : words('おなじ でんしゃを みつけよう','Find the matching trains');
  $('#actions').hidden = false;
  $('#again').hidden = !completed;
  $('#again').textContent = words('もういっかい','Play again');
  $('#mode').textContent = memory ? words('えあわせで あそぶ','Play picture matching') : words('めくってみる','Try flipping cards');
  cards.forEach(({train,matched},index) => {
    const button = board.children[index];
    const active = selected.includes(index);
    const visible = !memory || active || matched;
    button.classList.toggle('back',!visible);
    button.classList.toggle('matched',matched);
    button.setAttribute('aria-pressed',String(active));
    button.setAttribute('aria-label',(visible ? train[lang] : words('うらむきのカード','Face-down card')) + (matched ? words('・ペア',' · matched') : '') + ' ' + (index+1));
    button.disabled = matched;
    if (visible && button.firstElementChild?.tagName !== 'IMG') button.replaceChildren(picture(train));
    if (!visible) button.textContent = '🚃';
  });
}
function pick(index) {
  if (locked || cards[index].matched || selected.includes(index)) return;
  selected.push(index);
  if (selected.length === 2) {
    const [a,b] = selected.map(i => cards[i]);
    if (a.train === b.train) {
      a.matched = b.matched = true;
      selected = [];
      const convoy = document.createElement('div');
      convoy.className = 'convoy';
      convoy.append(picture(a.train),picture(b.train));
      $('#track').replaceChildren(convoy);
      if (cards.every(card => card.matched)) playNotes([523,659,784,1047], .12, .29);
      else playNotes([523,659]);
    } else {
      locked = true;
      playNotes([150,120], .075, .085, 'triangle');
      timer = setTimeout(() => {
        selected = [];
        locked = false;
        render();
      },memory ? 850 : 330);
    }
  }
  render();
}
$('#lang').onclick = () => {
  lang = words('en','ja');
  try { localStorage.setItem('norimono-lang',lang); } catch {}
  render();
};
$('#again').onclick = start;
$('#mode').onclick = () => { memory = !memory; start(); };
start();
</script>
</html>
