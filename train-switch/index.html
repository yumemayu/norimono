<style>
*{box-sizing:border-box}body{margin:0;background:#fff7e8;color:#28433e;font:700 17px/1.5 system-ui,sans-serif;text-align:center}main{max-width:720px;margin:auto;padding:18px 12px 30px}h1{font-size:clamp(26px,6vw,42px);margin:0}p{margin:8px 0 12px;min-height:1.5em}.board{position:relative;aspect-ratio:640/365;overflow:hidden;border-radius:24px;background:#d8edcc;border:3px solid white;box-shadow:0 5px 0 #e7dfcb;margin-bottom:16px}canvas{display:block;width:100%;height:100%}.yellow{--edge:#a56912;--body:#ffd449;--light:#fff1a4;--ink:#563305}
.blue{--edge:#28628b;--body:#66bbf5;--light:#d4f0ff;--ink:#123d62}
.station{position:absolute;top:3%;width:34%;height:28%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3%;border:2px solid var(--edge);border-top:clamp(7px,2vw,14px) solid var(--edge);border-radius:22px 22px 12px 12px;color:var(--ink);background:linear-gradient(165deg,var(--light),var(--body) 59%);box-shadow:inset 0 0 0 2px #fffc,0 5px 0 var(--edge),0 8px 0 #fff;font-size:clamp(12px,3vw,19px);line-height:1.1;white-space:nowrap}
.station:disabled{opacity:1}
.station:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 0 0 2px #fffc,0 2px 0 var(--edge)}
.station .symbol,.destination .symbol{display:inline-grid;place-items:center;flex:none;aspect-ratio:1;border-radius:50%;background:#fff9e9;color:var(--edge);line-height:1}
.station .symbol{width:clamp(27px,6vw,47px);font-size:clamp(20px,4.8vw,36px);box-shadow:0 2px 0 #0002}
.station.yellow{left:5%}.station.blue{right:5%}
.train{position:absolute;width:25%;height:25%;object-fit:contain;transform:translate(-50%,-55%);pointer-events:none}.lever{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:3px solid white;border-radius:50%;min-width:49px;min-height:49px;width:11%;aspect-ratio:1;background:#285b51;color:white;font-size:26px;padding:0;box-shadow:0 3px 0 #21463e}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{cursor:default;opacity:.55}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.controls button{border:0;border-radius:14px;padding:10px 14px;background:#ecdfc7;color:#233e38;min-height:46px}.controls button[aria-pressed=true]{background:#f8d988;box-shadow:inset 0 0 0 2px #9a731f}#go{background:#285b51;color:white;min-width:112px}#progress{font-size:15px;color:#47645f}button:focus-visible{outline:3px solid #963f76;outline-offset:3px}
.station.arrived{outline:4px solid white;outline-offset:2px;box-shadow:0 5px 0 var(--edge),0 0 24px 7px var(--body);animation:station-pop .55s ease-out}
@keyframes station-pop{45%{transform:scale(1.06)}}
#effects{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.spark{position:absolute;color:var(--color);font-size:clamp(15px,4vw,32px);animation:spark .85s ease-out both}
@keyframes spark{from{opacity:1;transform:translate(-50%,-50%) scale(.5)}65%{opacity:1}to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(65deg)}}
.confetti{position:absolute;top:-10%;width:9px;height:14px;background:var(--color);border-radius:2px;animation:confetti 1.5s ease-in both;animation-delay:var(--delay)}
@keyframes confetti{from{transform:translateY(0) rotate(0)}to{transform:translate(var(--dx),45vw) rotate(310deg);opacity:0}}
.board.cleared{border-color:#e4ae35}
@media(prefers-reduced-motion:reduce){.station.arrived{animation:none}}
.controls .destination{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:2px solid var(--edge);background:var(--body);color:var(--ink);border-radius:24px;padding:6px 12px 6px 8px;box-shadow:0 3px 0 var(--edge)}
.destination .symbol{width:26px;font-size:19px}
.controls .destination[aria-pressed=true]{background:var(--body);box-shadow:inset 0 0 0 2px white,0 3px 0 var(--edge)}
.controls .destination:active:not(:disabled){transform:translateY(2px)}
.hiiro-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-top:18px;padding-top:15px;border-top:1px solid #e3d8c3}
.hiiro-links a{display:flex;align-items:center;gap:7px;text-align:left;min-height:47px;padding:8px 10px;border-radius:14px;border:2px solid #fff;background:var(--banner-color);color:#28433e;text-decoration:none;box-shadow:0 2px 0 #e7dfcb;font-size:14px;line-height:1.3}
.banner-icon{font-size:20px;flex:none}
.feedback a{display:inline-block;padding:12px;color:#47645f;font-size:13px;text-underline-offset:3px}
.hiiro-links a:focus-visible,.feedback a:focus-visible{outline:3px solid #963f76;outline-offset:3px}
#game-language{min-height:44px;padding:0 12px;border:2px solid #e9dfcd;border-radius:12px;background:#fff;color:#28433e;font:700 14px system-ui;white-space:nowrap}
.game-heading{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.game-heading h1{margin-block:0}
.town-games{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;color:#463b33}
</style>

const labels = {yellow:'☀ きいろ',blue:'☁ あお'};
const rounds = ['yellow','blue','blue','yellow'];
const routes = {
  left:[[320,315],[320,205],[140,85]],
  right:[[320,315],[320,205],[500,85]]
};
const canvas = byId('tracks');
const ctx = canvas.getContext('2d');
ctx.scale(2,2);
let route = 'left';
let round = 0;
let running = false;
let phase = 'ready';

function position(x,y) {
  train.style.left = `${x / 6.4}%`;
  train.style.top = `${y / 3.65}%`;
}

function draw() {
  ctx.clearRect(0,0,640,365);
  const shrubs = [[55,117],[87,153],[563,156],[584,98],[185,300],[102,272],[490,280],[559,251],[235,77],[399,73]];
  shrubs.forEach(([x,y],i) => {
    ctx.fillStyle = i % 2 ? '#99c993' : '#b1d4a1';
    ctx.beginPath();
    ctx.ellipse(x,y,22,13,0,0,Math.PI*2);
    ctx.fill();
  });
  for (const side of ['left','right']) {
    const points = routes[side];
    ctx.beginPath();
    ctx.moveTo(...points[0]);
    points.slice(1).forEach(point => ctx.lineTo(...point));
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#789182';
    ctx.lineWidth = 19;
    ctx.stroke();
    ctx.strokeStyle = '#f4f0e0';
    ctx.lineWidth = 13;
    ctx.stroke();
    ctx.save();
    ctx.setLineDash([3,8]);
    ctx.strokeStyle = '#789182';
    ctx.lineWidth = 12;
    ctx.lineCap = 'butt';
    ctx.stroke();
    ctx.restore();
  }
  const [,joint,station] = routes[route];
  ctx.beginPath();
  ctx.moveTo(...joint);
  ctx.lineTo(...station);
  ctx.strokeStyle = route === 'left' ? '#d29310' : '#388bc2';
  ctx.lineWidth = 5;
  ctx.stroke();
}

function select(side) {
  if (running || phase !== 'ready') return;
  route = side;
  byId('left').setAttribute('aria-pressed', String(side === 'left'));
  byId('right').setAttribute('aria-pressed', String(side === 'right'));
  byId('lever').textContent = side === 'left' ? '↖' : '↗';
  draw();
}

function controls() {
  for (const id of ['left','right','lever','yellow-station','blue-station']) byId(id).disabled = running || phase !== 'ready';
  byId('go').disabled = running;
}

const effects = byId('effects');
const celebrationColors = ['#bd7900','#236ba9','#d65b76','#368355','#8851a5'];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

function celebrate(side, cleared) {
  byId(side === 'left' ? 'yellow-station' : 'blue-station').classList.add('arrived');
  effects.parentElement.classList.toggle('cleared', cleared);
  if (reduceMotion.matches) return;
  const count = cleared ? 24 : 7;
  for (let i = 0; i < count; i += 1) {
    const piece = document.createElement('span');
    piece.className = cleared ? 'confetti' : 'spark';
    piece.style.setProperty('--color', celebrationColors[i % celebrationColors.length]);
    const angle = i * 2 * Math.PI / count;
    piece.style.left = cleared ? `${5 + i * 90 / count}%` : side === 'left' ? '22%' : '78%';
    piece.style.setProperty('--dx', `${Math.round(Math.cos(angle) * 65)}px`);
    if (cleared) {
      piece.style.setProperty('--delay', `${i % 6 * 55}ms`);
    } else {
      piece.textContent = '★';
      piece.style.top = '22%';
      piece.style.setProperty('--dy', `${Math.round(Math.sin(angle) * 54)}px`);
    }
    piece.addEventListener('animationend', () => piece.remove(), {once:true});
    effects.append(piece);
  }
}

function ready() {
  effects.replaceChildren();
  effects.parentElement.classList.remove('cleared');
  byId('yellow-station').classList.remove('arrived');
  byId('blue-station').classList.remove('arrived');
  phase = 'ready';
  train.src = artwork[rounds[round]];
  train.alt = labels[rounds[round]] + 'の しんかんせん';
  position(...routes.left[0]);
  byId('message').textContent = labels[rounds[round]] + 'の えきを タップ！';
  byId('progress').textContent = `ついた でんしゃ  ${round} / ${rounds.length}`;
  byId('go').textContent = 'しゅっぱつ';
  controls();
}

function arrive(side) {
  running = false;
  const correct = (side === 'left' ? 'yellow' : 'blue') === rounds[round];
  if (correct) round += 1;
  phase = round === rounds.length ? 'done' : 'arrived';
  if (correct) celebrate(side, phase === 'done');
  byId('message').textContent = phase === 'done' ? 'ぜんぶの でんしゃが ついたよ！' :
    correct ? 'ぴったりの えきに ついたよ！' : labels[rounds[round]] + 'の えきを さがそう';
  byId('progress').textContent = `ついた でんしゃ  ${round} / ${rounds.length}`;
  byId('go').textContent = phase === 'done' ? 'もういちど' : correct ? 'つぎの でんしゃ' : 'もういちど';
  controls();
}

function depart() {
  if (running) return;
  if (phase !== 'ready') {
    if (phase === 'done') round = 0;
    ready();
    return;
  }
  running = true;
  controls();
  const side = route;
  const [start,joint,end] = routes[side];
  const duration = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1500;
  const started = performance.now();
  function frame(now) {
    const progress = duration ? Math.min(1, Math.max(0,(now - started) / duration)) : 1;
    const firstLeg = progress < .34;
    const [from,to,fraction] = firstLeg ? [start,joint,progress / .34] : [joint,end,(progress - .34) / .66];
    position(from[0] + (to[0] - from[0]) * fraction, from[1] + (to[1] - from[1]) * fraction);
    if (progress < 1) requestAnimationFrame(frame);
    else arrive(side);
  }
  requestAnimationFrame(frame);
}

byId('left').onclick = () => select('left');
byId('right').onclick = () => select('right');
byId('lever').onclick = () => select(route === 'left' ? 'right' : 'left');
for (const [stationId, side] of [['yellow-station', 'left'], ['blue-station', 'right']]) {
  byId(stationId).onclick = () => {
    if (running || phase !== 'ready') return;
    select(side);
    depart();
  };
}
byId('go').onclick = depart;
draw();
ready();
</script>
