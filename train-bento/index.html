#celebrate{position:absolute;inset:0;background:#fff2e3ee;display:grid;place-content:center;gap:14px}#celebrate[hidden]{display:none}#celebrate strong{font-size:clamp(29px,8vw,64px);color:#904022}.closed-box{background:linear-gradient(#acf1cc,#6fb18f);border:7px solid #8dc7a7;border-radius:29px;padding:10px;display:flex;align-items:center;width:min(65vw,430px);aspect-ratio:1.7;box-shadow:0 7px #548c71}.closed-box{animation:close .36s ease-out both}@keyframes close{from{transform:scale(.92) rotateX(35deg);opacity:.45}to{transform:none;opacity:1}}.closed-box img{width:33%;height:100%;object-fit:contain}#again{justify-self:center}#ghost{position:fixed;z-index:4;pointer-events:none;width:clamp(85px,22vw,195px);height:110px;transform:translate(-50%,-50%)}#ghost.food{width:90px;height:90px}

/* Keep play and primary touch controls side by side on landscape tablets. */
@media (orientation: landscape) and (min-width: 740px) and (min-height: 360px) {
main { max-width: 1280px; padding: 14px 18px 22px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 23%); gap: 8px 14px; align-items: start; }
main > :is(header, #hint, nav, footer) { grid-column: 1 / -1; }
#hint { margin: 0; }
#language { min-height: 48px; }
#board { width: 100%; max-width: calc(clamp(220px, 71dvh, 550px) * 1170 / 670); justify-self: center; }
#tray { grid-template-columns: minmax(0,1fr); width: 100%; margin: 0; align-self: center; }
.piece { min-height: 58px; }
.piece img { height: clamp(38px, 10dvh, 92px); }
#board:has(#celebrate:not([hidden])) { grid-column: 1 / -1; }
.closed-box { width: min(48vw, 37dvh, 400px); }
#celebrate { gap: 6px; }
#celebrate strong { font-size: clamp(24px, 7dvh, 54px); }
#again { min-height: 48px; }
main > nav.hiiro-links { width: 100%; }
}

const $ = selector => document.querySelector(selector);
const slots = [...document.querySelectorAll('.slot')];
const fits = (piece,index) => index < 3 ? piece?.kind !== 'food' && (!placed[index] || (placed.includes(piece) && placed[index] !== piece)) : piece?.kind === 'food' && placed[index] !== piece;
let lang = 'ja', round, placed, selected, closed, drag, suppressClick, audio;

const words = (ja,en) => lang === 'ja' ? ja : en;
const name = train => words(train.ja,train.en);
function picture(train) {
  const img = new Image();
  img.src = train.src;
  img.alt = '';
  img.draggable = false;
  return img;
}
function sound(notes, spacing = .11, duration = .22) {
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume().catch(() => {});
    notes.forEach((frequency,index) => {
      const start = audio.currentTime + index * spacing;
      const tone = audio.createOscillator();
      const volume = audio.createGain();
      tone.type = 'sine';
      tone.frequency.value = frequency;
      volume.gain.setValueAtTime(.001,start);
      volume.gain.exponentialRampToValueAtTime(.085,start+.018);
      volume.gain.exponentialRampToValueAtTime(.001,start+duration);
      tone.connect(volume).connect(norimonoAudio.output(audio));
      tone.start(start);
      tone.stop(start+duration+.01);
    });
  } catch {}
}
function start() {
  const pool = [...trains];
  round = Array.from({length:3}, () => pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  placed = [null, null, null, ...foods];
  selected = null;
  closed = false;
  function makePiece(train) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'piece';
    button.append(picture(train),document.createElement('span'));
    button.addEventListener('click', event => {
      if (ignoreClick(event) || placed.includes(train)) return;
      selected = train;
      render();
    });
    button.addEventListener('pointerdown', event => beginDrag(event,train));
    return button;
  }
  $('#tray').replaceChildren(...round.map(makePiece));
  render();
}
function render() {
  document.documentElement.lang = lang;
  $('#title').textContent = words('でんしゃのおべんとうばこ','Train Bento Box');
  document.title = $('#title').textContent + words(' | Hiiroゲーム',' | Hiiro Games');
  $('#language').textContent = words('English','日本語');
  $('#feedback').textContent = words('ご要望を送る','Send feedback');
  $('.hiiro-links').setAttribute('aria-label',words('ほかのでんしゃゲーム','More train games'));
  $('#pairs').textContent = words('でんしゃペア','Train Pairs');
  $('#ride').textContent = words('のりもの しゅっぱつ！','Let’s Ride!');
  $('#gacha').textContent = words('でんしゃガチャ','Train Gacha');
  $('#success').textContent = words('✦ できた！ ✦','✦ All packed! ✦');
  $('#again').textContent = words('もういっかい','Play again');
  $('#hint').textContent = closed ? '' : placed.every(Boolean) ? words('ふたを パチン！','Close the lid!') : selected ? words('ひかる ところへ','Move it to a glowing spot') : words('でんしゃを ゆびで はこぼう','Slide a train into the box');

  $('#lid').setAttribute('aria-label',words('ふたを しめる','Close the lid'));

  $('#tray').hidden = closed;
  slots.forEach((slot,index) => {
    const train = placed[index];
    const canDrop = !!selected && fits(selected,index);
    slot.disabled = closed || (!canDrop && !train && index < 3);
    slot.classList.toggle('ready',!closed && canDrop);
    if (index >= 3) slot.setAttribute('aria-pressed',String(selected === train));
    slot.setAttribute('aria-label',train ? name(train) : words('あいている しきり','Empty compartment')+' '+(index+1));

    if (!train) slot.replaceChildren();
  });
  [...$('#tray').children].forEach((button,index) => {
    const train = round[index];
    button.disabled = closed || placed.includes(train);

    button.setAttribute('aria-pressed',String(selected === train));
  });
}
function pack(index) {
  if (closed || !selected || !fits(selected,index)) return;
  const isFood = selected.kind === 'food';
  const sourceIndex = placed.indexOf(selected);
  if (sourceIndex >= 0) placed[sourceIndex] = placed[index];
  placed[index] = selected;

  selected = null;
  render();

}
function beginDrag(event,train) {
  if (!event.isPrimary || event.button !== 0 || !train || closed) return;

  const r=source.getBoundingClientRect();

  if(train.kind==='food')ghost.className='food';
  ghost.style.width=Math.min(train.kind==='food'?125:300,Math.max(train.kind==='food'?85:180,r.width*.92))+'px';

function dropTarget(x,y,piece) {

function ignoreClick(event) {

slots.forEach((slot,index) => {
  slot.addEventListener('pointerdown',event => beginDrag(event,placed[index]));
  slot.addEventListener('click', event => {
    if (ignoreClick(event)) return;

    pack(index);

};

};
