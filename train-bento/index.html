  if (isFood) placed[placed.indexOf(selected)] = placed[index];
  placed[index] = selected;
  sound(isFood ? [690, 880] : [290, 410], .046, .11);
  selected = null;
  render();
  if (!isFood && placed.every(Boolean)) $('#lid').focus();
}
function beginDrag(event,train) {
  if (!event.isPrimary || event.button !== 0 || !train) return;
  suppressClick = null;
  drag = {id:event.pointerId,x:event.clientX,y:event.clientY,train,source:event.currentTarget};
  event.currentTarget.setPointerCapture(event.pointerId);
}
function ignoreClick(event) {
  const ignored = event.detail > 0 && suppressClick === event.currentTarget;
  suppressClick = null;
  return ignored;
}
slots.forEach((slot,index) => {
  if (index >= 3) slot.addEventListener('pointerdown',event => beginDrag(event,placed[index]));
  slot.addEventListener('click', event => {
    if (ignoreClick(event)) return;
    if (index >= 3 && (!selected || selected.kind !== 'food' || selected === placed[index])) {
      selected = selected === placed[index] ? null : placed[index];
      render();
      return;
    }
    pack(index);
  });
});
$('#language').onclick = () => {
  lang = words('en','ja');
  try { localStorage.setItem('norimono-lang',lang); } catch {}
  render();
};
$('#lid').onclick = () => {
  closed = true;
  $('.closed-box').replaceChildren(...placed.slice(0,3).map(picture));
  sound([523,659,784]);
  render();
  $('#again').focus();
};
$('#again').onclick = start;
window.addEventListener('pointermove', event => {
  if (drag?.id !== event.pointerId) return;
  if (!drag.ghost && Math.hypot(event.clientX-drag.x,event.clientY-drag.y) > 8) {
    selected = drag.train;
    render();
    drag.ghost = document.createElement('div');
    drag.ghost.id = 'ghost';
    if (drag.train.kind === 'food') drag.ghost.className = 'food';
    drag.ghost.append(picture(drag.train));
    document.body.append(drag.ghost);
  }
  if (drag.ghost) {
    drag.ghost.style.left = event.clientX+'px';
    drag.ghost.style.top = event.clientY+'px';
  }
});
function endDrag(event) {
  if (drag?.id !== event.pointerId) return;
  if (drag.ghost) {
    drag.ghost.remove();
    suppressClick = drag.source;
    if (event.type === 'pointerup') {
      const index = slots.findIndex(slot => {
        const bounds = slot.getBoundingClientRect();
        return event.clientX >= bounds.left-7 && event.clientX <= bounds.right+7 &&
          event.clientY >= bounds.top-7 && event.clientY <= bounds.bottom+7 && fits(selected,slots.indexOf(slot));
      });
      if (index >= 0) pack(index);
    }
  }
  drag = null;
}
window.addEventListener('pointerup',endDrag);
window.addEventListener('pointercancel',endDrag);
start();
</script>
