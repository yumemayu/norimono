<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>でんしゃガチャ | Hiiroゲーム</title>
<style>
*{box-sizing:border-box}
body{touch-action:manipulation;margin:0;background:#e5f4ec;color:#213c3b;font:700 1rem system-ui,sans-serif}
main{max-width:850px;margin:auto;padding:clamp(12px,4vw,36px)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:clamp(1.35rem,5vw,2.5rem);margin:0}
#sound{border:2px solid #a3c9bb;background:#f9fdf9;color:#213c3b;border-radius:18px;width:50px;height:50px;font-size:1.2rem;cursor:pointer}
.stage{border:3px solid #244e46;border-radius:24px;overflow:hidden;background:#faf6ed;box-shadow:0 5px 0 #a3c9bb}
.train-area{display:grid;place-items:center;min-height:clamp(140px,34vw,285px);overflow:hidden;padding:10px 0 0}
.rail{height:20px;background:linear-gradient(#526d62 0 4px,transparent 4px 13px,#526d62 13px 17px,transparent 17px),repeating-linear-gradient(90deg,#ba906e 0 14px,#e5d7bd 14px 35px)}
#name{text-align:center;margin:.8rem;font-size:clamp(1.05rem,3vw,1.35rem)}
#next{display:flex;align-items:center;justify-content:center;gap:12px;width:min(100%,410px);min-height:84px;margin:22px auto 5px;padding:12px;border:3px solid #213c3b;border-radius:24px;background:#ffd36d;color:#213c3b;box-shadow:0 6px 0 #213c3b;font:inherit;font-size:clamp(1.45rem,5vw,2rem);cursor:pointer;touch-action:manipulation}
#next:active{transform:translateY(4px);box-shadow:0 2px 0 #213c3b}
button:focus-visible{outline:4px solid #2260a7;outline-offset:4px}
.train-area{position:relative;align-items:end;justify-items:center;padding:52px 8px 0;min-height:clamp(190px,36vw,320px)}
#crossing{position:absolute;z-index:2;bottom:0;right:9px;width:48px;height:112px;pointer-events:none}
.crossing-pole{position:absolute;bottom:0;left:21px;width:9px;height:86px;border:2px solid #20363e;border-radius:4px;background:repeating-linear-gradient(145deg,#ffce47 0 8px,#253841 8px 15px)}
.crossing-sign{position:absolute;top:0;left:13px;color:#ffcf43;-webkit-text-stroke:1px #20363e;font-size:29px;line-height:1}
.crossing-lamps{position:absolute;top:26px;left:3px;display:flex;gap:4px;padding:3px;border:2px solid #20363e;border-radius:8px;background:#34464a}
.crossing-lamps i{width:13px;height:13px;border:1px solid #192e35;border-radius:50%;background:#744c46}
#crossing[data-light="left"] i:first-child,#crossing[data-light="right"] i:last-child{background:#ff5d50}
.crossing-arm{position:absolute;right:19px;bottom:25px;width:clamp(48px,14vw,96px);height:9px;border:2px solid #20363e;border-radius:5px;background:repeating-linear-gradient(125deg,#ffcf43 0 11px,#253841 11px 19px);transform-origin:right center;transform:rotate(67deg);transition:transform .26s ease}
#crossing[data-closed="true"] .crossing-arm{transform:rotate(0)}
@media (prefers-reduced-motion:reduce){.crossing-arm{transition:none}}
#train-button{position:relative;display:flex;align-items:end;justify-content:center;gap:3px;width:min(94%,610px);min-height:70px;padding:0;border:0;background:transparent;cursor:pointer;touch-action:manipulation}
#train-button:focus-visible{outline-offset:-4px;border-radius:12px}
.car{position:relative;width:min(100%,var(--car-width,470px));flex-shrink:1;min-width:0}
.car img{display:block;width:100%;height:auto}
#train-button[data-double="true"] .car{width:calc(50% - 2px)}

.car[hidden],.door[hidden],#steam[hidden]{display:none}
.door{position:absolute;top:30%;width:16%;height:48%;overflow:hidden;border:2px solid #122746;border-radius:10%;background:#25374b}
.door::before,.door::after{content:"";position:absolute;top:0;bottom:0;width:50%;background:#94ca14;border:1px solid #122746;transform:translateX(var(--slide))}
.door::before{left:0;--slide:-83%}
.door::after{right:0;--slide:83%}
.door.one{left:15%}
.door.two{left:62%}
#steam{position:absolute;right:13%;top:0;color:white;text-shadow:0 1px 2px #607a73;font-size:clamp(24px,8vw,58px);pointer-events:none}
#next[aria-disabled="true"]{opacity:.75}
@media (prefers-reduced-motion:no-preference){
  #steam:not([hidden]){animation:puff .68s ease-out both}
  @keyframes puff{from{transform:scale(.65);opacity:.9}to{transform:translate(14px,-25px) scale(1.2);opacity:0}}
}
 .header-actions{display:flex;gap:8px;align-items:center}
#lang{position:relative;width:100%;min-height:98px;padding:14px 16px 24px;border:3px solid #244e46;border-radius:20px;background:linear-gradient(#bfe6f7 0 62%,#a8d89a 62% 100%);color:#213c3b;box-shadow:0 5px 0 #a3c9bb;overflow:hidden;font:inherit}
#lang{cursor:pointer}
@media(max-width:360px){header{flex-wrap:wrap}}

/* Keep play and primary touch controls side by side on landscape tablets. */
@media (orientation: landscape) and (min-width: 740px) and (min-height: 360px) {
main { max-width: 1280px; padding: 14px 18px 22px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(195px, 25%); gap: 12px 16px; align-items: start; }
main > :is(header, nav) { grid-column: 1 / -1; }
header { margin: 0; }
.stage { grid-column: 1; }
.train-area { min-height: clamp(195px, 52dvh, 450px); }
#next { grid-column: 2; width: 100%; min-height: 84px; margin: 0; align-self: center; font-size: clamp(17px, 2.4vw, 26px); }
.header-actions :is(#lang, #sound) { min-height: 48px; }
main > nav.hiiro-links { width: 100%; }
}
</style>

const langButton = document.querySelector('#lang');
const title = document.querySelector('#title');
const nextLabel = document.querySelector('#next-label');
const stage = document.querySelector('.stage');
const gamesNav = document.querySelector('.hiiro-links');
const trainNamesEn = ['Green commuter train', 'Blue bullet train', 'Red bullet train',
  'Green bullet train', 'Yellow bullet train', 'Streetcar', 'Steam locomotive'];
let lang = 'ja';
try {
  if (localStorage.getItem('norimono-lang') === 'en') lang = 'en';
} catch {}
const localized = (ja, en) => lang === 'en' ? en : ja;

const train = document.querySelector('#train');
const trainButton = document.querySelector('#train-button');
const extraCar = document.querySelector('#extra-car');
const crossing = document.querySelector('#crossing');
const doors = [...document.querySelectorAll('.door')];
const steam = document.querySelector('#steam');
const name = document.querySelector('#name');
const next = document.querySelector('#next');
const sound = document.querySelector('#sound');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
let index = 0;
let coupledIndex = null;
let arriving = false;
let steamTimer;
let audio;
let master;
let soundEnabled = true;
const pictures = trains.map(({src}) => {
  const picture = new Image();
  picture.src = src;
  return picture;
});

function playNotes(notes, spacing = .12, length = .18) {
  if (!soundEnabled) return;
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return;
  try {
    if (!audio) {
      audio = new Audio();
      master = audio.createGain();
      master.connect(audio.destination);
    }
    if (audio.state === 'suspended') audio.resume().catch(() => {});
    notes.forEach((pitch, count) => {
      const at = audio.currentTime + count * spacing;
      const oscillator = audio.createOscillator();
      const volume = audio.createGain();
      oscillator.frequency.value = pitch;
      volume.gain.setValueAtTime(.001, at);
      volume.gain.exponentialRampToValueAtTime(.075, at + .025);
      volume.gain.exponentialRampToValueAtTime(.001, at + length);
      oscillator.connect(volume).connect(master);
      oscillator.start(at);
      oscillator.stop(at + length + .01);
    });
  } catch {}
}

function showTrain() {
  train.src = pictures[index].src;
  const coupled = coupledIndex !== null;
  trainButton.dataset.double = String(coupled);
  trainButton.dataset.coupling = coupledIndex === 3 ? 'shinkansen' : '';
  extraCar.hidden = !coupled;
  if (coupled) extraCar.firstElementChild.src = pictures[coupledIndex].src;
  trainButton.style.setProperty('--car-width', index === 6 ? '350px' : index === 5 ? '375px' : '470px');
  renderTrainName();
}

function renderTrainName() {
  const label = coupledIndex === 0 ? localized('みどりの でんしゃが 2りょう！', 'Two green commuter cars!')
    : coupledIndex === 3 ? localized('あかと みどりの しんかんせんが れんけつ！', 'Red and green bullet trains coupled!')
    : localized(trains[index].name, trainNamesEn[index]);
  name.textContent = label;
  trainButton.setAttribute('aria-label', localized(label + ' タップして あそぶ', 'Tap to play: ' + label));
}

const gameLinks = Array.from(gamesNav.querySelectorAll('[data-en]'), element => ({
  element, ja: element.textContent, en: element.dataset.en
}));

function renderLanguage() {
  document.documentElement.lang = lang;
  title.textContent = localized('でんしゃガチャ', 'Surprise Trains');
  document.title = title.textContent + localized(' | Hiiroゲーム', ' | Hiiro Games');
  langButton.textContent = localized('English', 'にほんご');
  langButton.lang = localized('en', 'ja');
  sound.setAttribute('aria-label', localized('おと', 'Sound'));
  nextLabel.textContent = localized('つぎのでんしゃ', 'Next train');
  stage.setAttribute('aria-label', localized('でんしゃのホーム', 'Train platform'));
  gamesNav.setAttribute('aria-label', localized('ほかのでんしゃゲーム', 'More train games'));
  gameLinks.forEach(({element, ja, en}) => { element.textContent = localized(ja, en); });
  renderTrainName();
}

langButton.addEventListener('click', () => {
  lang = lang === 'ja' ? 'en' : 'ja';
  try { localStorage.setItem('norimono-lang', lang); } catch {}
  renderLanguage();
});

function resetEffects() {
  doors.forEach(door => { door.hidden = true; });
  clearTimeout(steamTimer);
  steam.hidden = true;
}

function finishArrival() {
  crossing.dataset.light = '';
  crossing.dataset.closed = 'false';
  arriving = false;
  next.removeAttribute('aria-disabled');
  trainButton.removeAttribute('aria-disabled');
}

const bringNextTrain = () => {
  if (arriving) return;
  arriving = true;
  next.setAttribute('aria-disabled','true');
  trainButton.setAttribute('aria-disabled','true');
  resetEffects();
  crossing.dataset.closed = 'true';
  crossing.dataset.light = 'left';
  playNotes([690, 690], .4);
  setTimeout(() => { crossing.dataset.light = 'right'; }, 400);
  setTimeout(() => {
    crossing.dataset.light = 'left';
    const previous = index;
    index = (index + 1 + Math.floor(Math.random() * (trains.length - 1))) % trains.length;
    coupledIndex = null;
    const bonus = Math.random();
    if (bonus < .12 && previous !== 0) {
      index = 0;
      coupledIndex = 0;
    } else if (bonus >= .12 && bonus < .24 && previous !== 2) {
      index = 2;
      coupledIndex = 3;
    }
    showTrain();
    if (reducedMotion.matches || !trainButton.animate) {
      finishArrival();
      return;
    }
    const arrival = trainButton.animate(
      [{transform:'translateX(-115%)'},{transform:'translateX(0)'}],
      {duration:620,easing:'cubic-bezier(.18,.8,.25,1)'}
    );
    arrival.finished.then(finishArrival, finishArrival);
  }, 800);
};
next.addEventListener('click', bringNextTrain);
// Babies play by banging the whole screen, so any tap that is not on
// a control or a link brings the next train too.
document.addEventListener('click', (event) => {
  if (event.target.closest('#next, #sound, #lang, a')) return;
  bringNextTrain();
});

trainButton.addEventListener('click', () => {
  if (arriving) return;
  if (index === 0) {
    const open = doors[0].hidden;
    doors.forEach(door => { door.hidden = !open; });
    playNotes(open ? [430, 570] : [570, 430]);
  } else if (index === 5) {
    playNotes([620, 780], .14);
  } else if (index === 6) {
    playNotes([210, 330], .16, .3);
    clearTimeout(steamTimer);
    steam.hidden = false;
    steamTimer = setTimeout(() => { steam.hidden = true; }, 680);
  } else {
    playNotes([330, 440]);
  }
});
sound.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  if (master) master.gain.value = soundEnabled ? 1 : 0;
  sound.setAttribute('aria-pressed', String(soundEnabled));
  sound.textContent = soundEnabled ? '🔊' : '🔇';
});
showTrain();
renderLanguage();
</script>
