function renderPanels() {
  document.querySelectorAll('#speeds [data-speed]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.speed === speed)));
}
function stopTravelSound() {
  if (!travelSound) return;
  travelSound.disconnect();
  travelSound = undefined;
}

function playTravelSound(vehicle) {
  stopTravelSound();
  const bus = vehicle === 'bus' || workKinds.includes(vehicle);
  const now = audio.currentTime;
  const end = now + tripDuration;
  const pf = 12 / tripDuration;
  const mix = audio.createGain();
  travelSound = mix;
  mix.gain.setValueAtTime(0, now);
  mix.gain.linearRampToValueAtTime(.8, now + .24);
  mix.gain.setValueAtTime(.8, end - .48);
  mix.gain.linearRampToValueAtTime(0, end);
  mix.connect(master);

  const samples = audio.createBuffer(1, Math.ceil(audio.sampleRate * tripDuration), audio.sampleRate);
  const data = samples.getChannelData(0);
  let rumble = 0;
  for (let i = 0; i < data.length; i++) {
    rumble = .88 * rumble + .12 * (Math.random() * 2 - 1);
    const t = i / audio.sampleRate;
    const pulse = bus ? .65 + .35 * Math.sin(2 * Math.PI * (16 * t + 2 * t * t)) : 1;
    data[i] = rumble * pulse;
  }
  const noise = audio.createBufferSource();
  noise.buffer = samples;
  const filter = audio.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime((bus ? 190 : 460) * pf, now);
  filter.frequency.linearRampToValueAtTime((bus ? 470 : 1300) * pf, end - .45);
  noise.connect(filter);
  filter.connect(mix);
  noise.start(now);

  const harmonics = (bus ? [[43, 94, .32], [86, 188, .10]] : [[96, 410, .16], [192, 820, .045]]).map(([l, h, lv]) => [l * pf, h * pf, lv]);
  for (const [low, high, level] of harmonics) {
    const tone = audio.createOscillator();
    const gain = audio.createGain();
    tone.type = bus ? 'triangle' : 'sine';
    tone.frequency.setValueAtTime(low, now);
    tone.frequency.exponentialRampToValueAtTime(high, end - .65);
    tone.frequency.exponentialRampToValueAtTime(low * 1.3, end);
    gain.gain.value = level;
    tone.connect(gain);
    gain.connect(mix);
    tone.start(now);
    tone.stop(end);
  }
}

function updateVolume() {
  volumeValue.textContent = volume.value + '%';
  mute.textContent = muted ? L[lang].off : L[lang].on;
  mute.setAttribute('aria-pressed', String(muted));
  if (master) master.gain.setTargetAtTime(muted ? 0 : Number(volume.value) / 100 * .3, audio.currentTime, .015);
}

volume.addEventListener('input', updateVolume);
mute.addEventListener('click', () => {
  muted = !muted;
  updateVolume();
});

function prepareAudio() {
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return;
  if (!audio) {
    audio = new Audio();
    master = audio.createGain();
    master.gain.value = 0;
    master.connect(audio.destination);
    updateVolume();
  }
  return audio.resume();
}

function playSound(notes) {
  if (audio?.state !== 'running' || muted || Number(volume.value) === 0) return;
  const now = audio.currentTime;
  for (const [from, to, offset, duration, type = 'sine'] of notes) {
    const start = now + offset;
    const end = start + duration;
    const tone = audio.createOscillator();
    const envelope = audio.createGain();
    tone.type = type;
    tone.frequency.setValueAtTime(from, start);
    tone.frequency.linearRampToValueAtTime(to, end);
    envelope.gain.setValueAtTime(0, start);
    envelope.gain.linearRampToValueAtTime(.65, start + .025);
    envelope.gain.linearRampToValueAtTime(0, end);
    tone.connect(envelope);
    envelope.connect(master);
    tone.start(start);
    tone.stop(end);
  }
}

function render() {
  const route = routes[kind];
  const stop = route.stops[progress[kind]];
  const trainStyle = kind === 'train' ? 'train-' + (trainVariant?.id || 'blue') : '';
  const artPath = kind === 'train'
    ? 'assets/go-shinkansen-' + (trainVariant?.id || 'blue') + '.webp'
    : currentArt[kind] ? 'assets/' + currentArt[kind] + '.webp' : vehicleArtPaths[kind];
  vehicleArt.hidden = !artPath;
  if (artPath && vehicleArt.getAttribute('src') !== artPath) vehicleArt.src = artPath;
  scene.className = ['scene', kind, phase, trainStyle].filter(Boolean).join(' ');
  const action = workActions[kind];
  workAction.hidden = phase !== 'arrived' || !action;
  if (action) workAction.textContent = action[lang];
  const view = scenery[stop];
  if (view) {
    scene.style.setProperty('--sky1', view.sky);
    scene.style.setProperty('--ground', view.ground);
  }
  if (decor.dataset.stop !== stop) {
    decor.innerHTML = view?.deco.map(detail => {
      const placement = skyDetails.has(detail) ? 'sky' : shoreDetails.has(detail) ? 'shore' : 'ground';
      return `<svg class="${placement}-detail" viewBox="0 0 64 52"><use href="assets/scenery.svg#${detail}"></use></svg>`;
    }).join('') ?? '';
    decor.dataset.stop = stop;
  }
  const stopText = lang === 'en' ? enStops[kind][progress[kind]] : stop;
  const vehicleName = kind === 'train'
    ? (trainVariant ? (lang === 'en' ? trainVariant.en : trainVariant.name) : (lang === 'en' ? enNames.train : route.name))
    : (lang === 'en' ? enNames[kind] : route.name);
  stopLabel.textContent = stopText;
  go.disabled = false;
  sceneTap.setAttribute('aria-label', action ? action[lang] : (lang === 'en' ? 'Tap the vehicle' : 'のりものを タップ'));
  sceneTap.classList.toggle('work-ready', phase === 'arrived' && Boolean(action));
  const flying = kind === 'plane' || kind === 'helicopter';
  const movement = flying ? L[lang].flying : L[lang].going;
  goLabel.textContent = L[lang].go;
  if (phase === 'moving') {
    message.textContent = lang === 'en' ? vehicleName + (flying ? ' is flying!' : ' is on its way!') : vehicleName + 'が ' + movement + '！';
  } else if (phase === 'arrived') {
    message.textContent = celebration
      ? (lang === 'en' ? '🎉 You made it to ' + stopText + '! Great ride!' : '🎉 ' + stopText + 'に とうちゃく！おつかれさま！')
      : (lang === 'en' ? 'Arrived at ' + stopText + '! Great ride!' + (kind === 'police' || flying || action ? '' : ' The doors opened.') : stopText + 'に とうちゃく！おつかれさま！' + (kind === 'police' || flying || action ? '' : ' ドアが あいたよ'));
  } else {
    message.textContent = lang === 'en' ? 'Press Go! Which vehicle will appear?' : 'ゴーを おすと なにが でるかな？';
  }
  choices.forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.kind === kind));
  });
  renderPanels();
}

function interruptTrip() {
  const moving = phase === 'moving';
  clearTimeout(arrival);
  arrival = undefined;
  stopTravelSound();
  return moving;
}

function finishSelection(resume) {
  celebration = false;
  phase = 'ready';
  if (resume) startTrip();
  else render();
}

go.addEventListener('click', startTrip);

function startTrip() {
  interruptTrip();
  const candidates = Object.keys(routes).filter(vehicle => vehicle !== kind);
  kind = candidates[Math.floor(Math.random() * candidates.length)];
  celebration = false;
  tripDuration = speeds[speed];
  scene.style.setProperty('--trip-time', tripDuration + 's');
  if (kind === 'plane' || kind === 'helicopter') {
    const nextRoutes = airRoutes.filter(route => route !== airLandscape.dataset.route);
    airLandscape.dataset.route = nextRoutes[Math.floor(Math.random() * nextRoutes.length)];
  }
  if (kind === 'train') {
    const variants = trainVariants.filter(variant => variant !== trainVariant && (variant.id !== 'yellow' || yellowUnlocked));
    trainVariant = variants[Math.floor(Math.random() * variants.length)];
  }
  if (artVariants[kind]) {
    const variants = artVariants[kind].filter(art => art !== currentArt[kind]);
    currentArt[kind] = variants[Math.floor(Math.random() * variants.length)];
  }
  phase = 'moving';
  render();
  const departureKind = kind;
  const tripRoute = routes[departureKind];
  let tripTarget = progress[departureKind];
  while (tripTarget === progress[departureKind]) tripTarget = Math.floor(Math.random() * tripRoute.stops.length);
  arrival = setTimeout(() => {
    arrival = undefined;
    kind = departureKind;
    const target = tripTarget;
    progress[departureKind] = target;
    const wasStamped = stamps[departureKind][target];
    stamps[departureKind][target] = true;
    saveStamps();
    const cardComplete = stamps[departureKind].every(Boolean);
    celebration = target === tripRoute.stops.length - 1 || (cardComplete && !wasStamped);
    phase = 'arrived';
    render();
    stopTravelSound();
    let unlockedNow = false;
    if (departureKind === 'train' && cardComplete && !yellowUnlocked) {
      yellowUnlocked = true;
      unlockedNow = true;
      try { localStorage.setItem('norimono-yellow', '1'); } catch {}
    }
    if (celebration || unlockedNow) {
      celebrate();
      playSound(fanfare);
    } else {
      playSound(doorChime);
      if (departureKind !== 'train') playSound(arrivalSound);
    }
    if (unlockedNow) message.textContent += ' ' + (lang === 'en' ? '🎉 Yellow Shinkansen is unlocked!' : '🎉 きいろい しんかんせんが つかえるように なったよ！');
  }, tripDuration * 1000);
  const trip = arrival;
  try {
    prepareAudio()?.then(() => {
      if (phase !== 'moving' || arrival !== trip) return;
      playSound(departureSirens[Math.floor(Math.random() * departureSirens.length)]);
      if (departureKind !== 'police') playTravelSound(departureKind);
    }).catch(() => {});
  } catch {
    // Driving still works if the browser cannot initialize audio.
  }
}

function applyLang() {
  document.querySelector('#feedback-link').textContent = lang === 'en' ? 'Send feedback' : 'ご要望を送る';
  document.documentElement.lang = lang;
  document.title = L[lang].title;
  document.querySelector('#title').textContent = L[lang].title;

  choices.forEach(button => {
    button.querySelector('.vehicle-name').textContent = lang === 'en' ? enNames[button.dataset.kind] : routes[button.dataset.kind].name;
  });
  document.querySelector('#volume-label').textContent = L[lang].volume;
  document.querySelector('.sound').setAttribute('aria-label', L[lang].sound);
  langButton.textContent = lang === 'en' ? 'にほんご' : 'English';
  document.querySelector('#random-note').textContent = T[lang].random;
  document.querySelector('#speed-label').textContent = T[lang].speed;
  document.querySelectorAll('#speeds [data-speed]').forEach(b => { b.querySelector('.speed-name').textContent = T[lang][b.dataset.speed]; });
  updateVolume();
  render();
}
langButton.addEventListener('click', () => {
  lang = lang === 'en' ? 'ja' : 'en';
  try { localStorage.setItem('norimono-lang', lang); } catch {}
  applyLang();
});
applyLang();
</script>
<script>
const playArea = document.querySelector('#field, #cats, #scene');
const reduceTapMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
playArea?.addEventListener('pointerdown', event => {
  if (event.button !== 0) return;
  const sparkle = document.createElement('span');
  sparkle.className = 'tap-sparkle';
  sparkle.setAttribute('aria-hidden', 'true');
  sparkle.textContent = '✦';
  sparkle.style.left = event.clientX + 'px';
  sparkle.style.top = event.clientY + 'px';
  document.body.append(sparkle);
  const animation = sparkle.animate(reduceTapMotion.matches
    ? [{ opacity: 1 }, { opacity: 0 }]
    : [{ opacity: 1, transform: 'translate(-50%, -50%) scale(.65)' },
      { opacity: 0, transform: 'translate(-50%, -105%) scale(1.4)' }],
    { duration: reduceTapMotion.matches ? 180 : 430, easing: 'ease-out' });
  animation.onfinish = () => sparkle.remove();
});
</script>
</html>
